services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - 6379:6379
    volumes:
      - ./redis-data:/data
    restart: unless-stopped
    networks:
      - ac-net

  app:
    build: .
    ports:
      - 8080:8080
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      AUTOCOMPLETE_CACHE_TTL_MINUTES: "10"
    depends_on:
      - redis
    networks:
      - ac-net

networks:
  ac-net:
    driver: bridge
