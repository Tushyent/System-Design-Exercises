server.port=8080
spring.application.name=job-portal-crawler

# ---------------- Redis ----------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s

# ---------------- Token bucket (question b: capacity 5, refill 1/s) ----------------
ratelimit.capacity=${RATELIMIT_CAPACITY:5}
ratelimit.refill-per-second=${RATELIMIT_REFILL_PER_SECOND:1}
ratelimit.prefix=${RATELIMIT_PREFIX:ratelimit}
ratelimit.ttl-seconds=${RATELIMIT_TTL_SECONDS:3600}
ratelimit.store=${RATELIMIT_STORE:redis}

# ---------------- Crawler (question a: max 10 urls per request) ----------------
crawler.max-pages-per-request=${CRAWLER_MAX_PAGES:10}
crawler.fetch-timeout-ms=${CRAWLER_TIMEOUT_MS:6000}
crawler.user-agent=JobPortalCrawler/1.0 (+http://localhost:8080)
crawler.queue-key=jobcrawl:queue
crawler.visited-key=jobcrawl:visited

# ---------------- OpenAPI / Swagger ----------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---------------- Logging ----------------
logging.level.com.jobportal=INFO
