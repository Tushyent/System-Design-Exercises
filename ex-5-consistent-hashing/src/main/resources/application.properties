server.port=${PORT:8080}

# Initial storage nodes (host:port). Uses mapped host ports so the app can run
# on the host against Docker-hosted mongod instances. When running the app itself
# inside Docker, override with APP_NODES=mongo1:27017,mongo2:27017,mongo3:27017.
app.nodes=localhost:27017,localhost:27018,localhost:27019

# Consistent hashing
app.virtual-nodes=150

# Logical "mongo4" demo node. The demo registers mongo4 by name; these settings
# map it to a reachable address. Host mode: localhost:27020 (docker-published
# port). Docker mode: override with APP_MONGO4_HOST=mongo4 and
# APP_MONGO4_PORT=27017 (container-internal port).
app.mongo4.host=localhost
app.mongo4.port=27020

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.consistenthashing=INFO
