spring.application.name=vidya-lms
server.port=8080

# ---------------- MongoDB Configuration ----------------
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/librarydb}
spring.data.mongodb.auto-index-creation=true

# ---------------- Redis Configuration ----------------
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# ---------------- Security & JWT ----------------
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ---------------- Snowflake ID Generator ----------------
snowflake.worker-id=${SNOWFLAKE_WORKER_ID:1}
snowflake.datacenter-id=${SNOWFLAKE_DATACENTER_ID:1}

# ---------------- Rate Limiter Defaults ----------------
# Strict policy for authentication (brute-force protection):
ratelimit.auth.capacity=10
ratelimit.auth.refill-per-second=2
# Generous policy for public catalogue reads (search + autocomplete):
# tuned to absorb the measured peak burst (~1,000 requests across 100
# concurrent clients) plus sustained browsing, while still capping
# runaway scrapers beyond 750 req/s sustained per IP.
ratelimit.search.capacity=1500
ratelimit.search.refill-per-second=750
ratelimit.default.capacity=40
ratelimit.default.refill-per-second=10

# ---------------- Actuator & OpenAPI ----------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
