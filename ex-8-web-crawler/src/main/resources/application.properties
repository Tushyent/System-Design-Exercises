server.port=8080

# Spring Data Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Web Crawler Parameters
crawler.default-max-depth=7
crawler.default-max-pages=50
crawler.default-workers=4
crawler.politeness-delay-ms=50
crawler.user-agent=SSN-WebCrawler/1.0 (+http://localhost:8080)
crawler.cache-ttl-minutes=60

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Logging
logging.level.com.crawler=INFO
logging.level.org.springframework.data.redis=WARN
