server.port=${PORT:8080}
spring.application.name=rate-limiter

# ---------------- Redis ----------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s

# ---------------- Rate limiter (token bucket) ----------------
# Bucket capacity (max tokens a client can hold).
ratelimit.capacity=${RATELIMIT_CAPACITY:10}
# Tokens added per second.
ratelimit.refill-per-second=${RATELIMIT_REFILL_PER_SECOND:5}
# Redis key prefix for buckets.
ratelimit.prefix=${RATELIMIT_PREFIX:ratelimit}
# TTL (s) per bucket key so stale clients are cleaned up.
ratelimit.ttl-seconds=${RATELIMIT_TTL_SECONDS:3600}
# Backend store: redis (Lua, atomic) or memory (test double).
ratelimit.store=${RATELIMIT_STORE:redis}

# ---------------- OpenAPI / Swagger ----------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---------------- Logging ----------------
logging.level.com.ratelimiter=INFO